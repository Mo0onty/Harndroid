name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
    - name: Assemble Release
      run: ./gradlew assembleRelease
    - name: Run Tests
      run: ./gradlew test
